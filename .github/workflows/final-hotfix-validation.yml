name: Final integrated hotfix validation

on:
  push:
    branches:
      - final-right-center-recent-airpods-20260909
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Run regression tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Package validated project
        shell: pwsh
        run: git archive --format=zip --output=AirPodsWidget_Final_Integrated_20260909.zip HEAD
      - name: Upload validated project
        uses: actions/upload-artifact@v4
        with:
          name: AirPodsWidget_Final_Integrated_20260909
          path: AirPodsWidget_Final_Integrated_20260909.zip
          if-no-files-found: error
          compression-level: 0
